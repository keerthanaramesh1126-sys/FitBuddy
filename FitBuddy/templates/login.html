{% extends "base.html" %}
{% block title %}FitBuddy - Admin Login{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon">&#128274;</span>
            <h1 class="auth-title">Admin Login</h1>
            <p class="auth-subtitle">Access the FitBuddy admin dashboard</p>
        </div>
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        <form action="/login" method="post" class="auth-form">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-input"
                       placeholder="Admin username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-input"
                       placeholder="Admin password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>
        <p class="auth-footer"><a href="/" class="link-muted">Back to Home</a></p>
    </div>
</div>
{% endblock %}
